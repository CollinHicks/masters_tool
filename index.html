<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Injury Data Explorer</title>
<style>
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#1f2328;margin:0}
main{max-width:1320px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:15px;margin:0 0 10px}
section,details.sec,aside{background:#fff;border:1px solid #d5d9de;border-radius:4px;padding:14px 16px;margin-bottom:14px}
details.sec>summary{font-size:15px;font-weight:600;cursor:pointer}
details.sec>.body{margin-top:10px}
select,input[type=number],input[type=search],button,summary.ms{font:inherit;padding:6px 8px;border:1px solid #aab0b8;border-radius:4px;background:#fff;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #1a56c4;outline-offset:1px}
.frow,.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow{margin-bottom:8px}
.opts{gap:16px;align-items:flex-end}
label,.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:#4a5159}
label.check{flex-direction:row;align-items:center;gap:6px;font-size:15px;color:inherit;padding-bottom:7px}
#none{margin:0 0 8px;color:#4a5159}
#chartwrap{position:relative;height:460px}
.layout{display:flex;gap:16px;align-items:flex-start}
.col{flex:1;min-width:0}
aside{width:320px;flex:none;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;box-sizing:border-box;margin-bottom:0}
aside h2{margin-bottom:4px}
aside p{margin:0 0 8px;font-size:13px;color:#4a5159}
aside input[type=search]{width:100%;box-sizing:border-box;margin-bottom:8px}
#legend details{border-top:1px solid #e6e8eb;padding:6px 0 6px 8px;border-left:3px solid transparent}
#legend details.used{border-left-color:#2f6fdb}
#legend summary{cursor:pointer}
#legend details.used>summary{font-weight:600}
#legend small{display:block;color:#6a717a;font-size:12px;font-weight:400}
#legend .desc{font-size:13px;color:#2f353b;padding:6px 0 2px}
details.multi{position:relative}
summary.ms{list-style:none;cursor:pointer;min-width:150px;padding-right:24px;position:relative;white-space:nowrap}
summary.ms::-webkit-details-marker{display:none}
summary.ms::after{content:"▾";position:absolute;right:8px;color:#6a717a}
.mbody{position:absolute;z-index:10;top:100%;left:0;margin-top:2px;min-width:100%;width:max-content;max-width:320px;max-height:280px;overflow:auto;background:#fff;border:1px solid #aab0b8;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);box-sizing:border-box}
.mtools{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid #e6e8eb;position:sticky;top:0;background:#fff}
.mtools button{padding:2px 8px;font-size:13px}
label.opt{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:inherit;padding:4px 8px;cursor:pointer}
@media(max-width:900px){.layout{flex-direction:column}aside{width:100%;position:static;max-height:none}}
</style>
</head>
<body>
<main>
<h1>Injury Data Explorer</h1>
<p id="status">Loading data…</p>
<div id="app" class="layout" hidden>
<div class="col">
<section>
<h2>Filter</h2>
<p id="none">No filters. All injury records are included.</p>
<div id="filters"></div>
<button id="add">+ Add filter</button>
</section>
<details class="sec" open>
<summary>Group by<span id="gsum"></span></summary>
<div class="body opts">
<label>Group by<select id="group"></select></label>
<div class="fld" id="gshowL"><span>Groups to show</span><span id="gshow"></span></div>
</div>
</details>
<section>
<h2>Chart</h2>
<div class="opts">
<label>Show<select id="measure"></select></label>
<label>Chart type
<select id="type">
<option value="bar">Bar (vertical)</option>
<option value="hbar">Bar (horizontal)</option>
<option value="line">Line</option>
<option value="pie">Pie</option>
<option value="doughnut">Doughnut</option>
</select>
</label>
<label class="check"><input type="checkbox" id="sort">Largest first</label>
</div>
</section>
<section>
<p id="empty" hidden></p>
<div id="chartwrap"><canvas id="chart"></canvas></div>
</section>
</div>
<aside>
<h2>Variable guide</h2>
<p>What each variable means. Variables you are using are highlighted.</p>
<input type="search" id="q" placeholder="Search variables">
<div id="legend"></div>
</aside>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const DATA_FILE='synthetic_athletic_injury_dataset_1000.xlsx';
const ORDER={Class_Year:['Freshman','Sophomore','Junior','Senior','Graduate']};
const NAMES={
  Injury_or_Illness_Code:'Injury or illness',
  Inj_Ill_Group_Code:'Diagnosis group',
  Bodypart_or_System_Code:'Body part or system',
  PRIMARY_DIV:'Primary division',
  SPORT_DIV:'Sport division',
  SPORT_SUBDIVISION:'Football subdivision',
  School_ID:'School',
  TimeLoss:'Days lost',
  Injev_SegEvent:'Segment of practice/competition',
  C_Concussion_Time:'Concussion: symptom resolution time'
};
const PALETTE=['#2f6fdb','#e8743b','#19a979','#945ecf','#13a4b4','#c94f7c','#8c8c8c','#d6b400','#5a6ee0','#b5651d','#3aa655','#e04b4b','#7d6b5a','#4aa3df'];
const OPS_CAT=[['in','is one of'],['out','is not one of']];
const OPS_NUM=[['=','equal to'],['>','greater than'],['>=','greater than or equal to'],['<','less than'],['<=','less than or equal to']];
const SYM={'=':'=','>':'>','>=':'≥','<':'<','<=':'≤'};

let rows=[],V={},filters=[],chart=null,gsel=new Set(),usedKey='';
const $=id=>document.getElementById(id);
const key=v=>v===null||v===undefined||v===''?'':String(v);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=v=>(Math.round(v*10)/10).toLocaleString();
const pretty=n=>cap(n.replace(/^Injev_/,'').replace(/^C_/,'Concussion: ').replace(/_Code$/,'').replace(/_/g,' ').toLowerCase());
const show=(vr,k)=>k===''?'(blank)':vr.labels[k]!==undefined?vr.labels[k]:vr.codeLike?'Code '+k:k;

function buildVar(name,d){
  d=d||{};
  const desc=String(d.Illustrative_Values_or_Description||'');
  const labels={};
  desc.split(';').forEach(p=>{
    const m=p.match(/^\s*(-?\d+)\s*=\s*(.+?)\s*$/);
    if(m)labels[m[1]]=cap(m[2].replace(/\s*\(illustrative\)/i,''));
  });
  const c=desc.match(/(\d+) assigned to synthetic (\w+) records/i);
  if(c)labels[c[1]]=cap(c[2]);
  const nn=rows.map(r=>r[name]).filter(v=>v!==null&&v!=='');
  const allNum=nn.length>0&&nn.every(v=>typeof v==='number');
  const hasLabels=Object.keys(labels).length>0;
  const numeric=allNum&&!hasLabels&&(d.Variable?/numeric/i.test(d.Data_Type||'')&&!/categor|code|ordinal|identifier/i.test(desc):new Set(nn).size>12);
  const codeLike=!numeric&&allNum&&/categor|code|ordinal/i.test(desc)&&!/identifier/i.test(desc);
  const o=ORDER[name];
  const keys=[...new Set(rows.map(r=>key(r[name])))].sort((a,b)=>{
    if(a==='')return 1;
    if(b==='')return -1;
    if(o)return o.indexOf(a)-o.indexOf(b);
    const x=Number(a),y=Number(b);
    return isNaN(x)||isNaN(y)?a.localeCompare(b):x-y;
  });
  return {name,desc,label:NAMES[name]||pretty(name),numeric,labels,codeLike,keys,min:numeric?Math.min(...nn):0};
}

function init(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const n=wb.SheetNames;
  rows=XLSX.utils.sheet_to_json(wb.Sheets[n[1]||n[0]],{defval:null});
  if(!rows.length)throw new Error('The data sheet is empty.');
  const dict=n.length>2?XLSX.utils.sheet_to_json(wb.Sheets[n[n.length-1]],{defval:null}):[];
  const info={};
  dict.forEach(r=>{if(r.Variable&&(!info[r.Variable]||/injury/i.test(r.Section)))info[r.Variable]=r;});
  V={};
  Object.keys(rows[0]).filter(c=>!/^Record_UID/.test(c)).forEach(c=>{V[c]=buildVar(c,info[c]);});
  filters=[];
  const vars=varOpts();
  fill($('group'),[['none','None']].concat(vars),V.Sport?'Sport':'none');
  const ms=[['count','Number of injuries']];
  Object.values(V).filter(v=>v.numeric).forEach(v=>{
    ms.push(['avg:'+v.name,'Average '+v.label.toLowerCase()]);
    ms.push(['sum:'+v.name,'Total '+v.label.toLowerCase()]);
  });
  fill($('measure'),ms,'count');
  buildLegend();
  renderGroupSel();
  renderFilters();
  $('status').hidden=true;
  $('app').hidden=false;
  draw();
}

function varOpts(){
  return Object.values(V).sort((a,b)=>a.label.localeCompare(b.label)).map(v=>[v.name,v.label]);
}

function fill(s,opts,val){
  s.innerHTML='';
  opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o);});
  s.value=val;
}

function sel(opts,val,fn){
  const s=document.createElement('select');
  fill(s,opts,val);
  s.onchange=()=>fn(s.value);
  return s;
}

function multi(keys,labelFn,selected,onChange,emptyText,allText){
  const d=document.createElement('details');
  d.className='multi';
  const s=document.createElement('summary');
  s.className='ms';
  const body=document.createElement('div');
  body.className='mbody';
  const tools=document.createElement('div');
  tools.className='mtools';
  const boxes=[];
  const upd=()=>{
    const n=selected.size;
    s.textContent=n===0?emptyText:(allText&&n===keys.length)?allText:n<=2?keys.filter(k=>selected.has(k)).map(labelFn).join(', '):n+' selected';
  };
  const setAll=on=>{
    selected.clear();
    if(on)keys.forEach(k=>selected.add(k));
    boxes.forEach(b=>{b.checked=on;});
    upd();
    onChange();
  };
  [['All',true],['Clear',false]].forEach(([t,on])=>{
    const b=document.createElement('button');
    b.type='button';
    b.textContent=t;
    b.onclick=()=>setAll(on);
    tools.append(b);
  });
  body.append(tools);
  keys.forEach(k=>{
    const l=document.createElement('label');
    l.className='opt';
    const c=document.createElement('input');
    c.type='checkbox';
    c.checked=selected.has(k);
    c.onchange=()=>{if(c.checked)selected.add(k);else selected.delete(k);upd();onChange();};
    boxes.push(c);
    l.append(c,document.createTextNode(labelFn(k)));
    body.append(l);
  });
  d.append(s,body);
  upd();
  return d;
}

function newFilter(name){
  const vr=V[name];
  return vr.numeric?{v:name,op:'>=',val:String(vr.min)}:{v:name,op:'in',sel:new Set()};
}

function renderFilters(){
  const box=$('filters');
  box.innerHTML='';
  $('none').hidden=filters.length>0;
  filters.forEach((f,i)=>{
    const vr=V[f.v];
    const row=document.createElement('div');
    row.className='frow';
    row.append(sel(varOpts(),f.v,x=>{filters[i]=newFilter(x);renderFilters();draw();}));
    row.append(sel(vr.numeric?OPS_NUM:OPS_CAT,f.op,x=>{f.op=x;draw();}));
    if(vr.numeric){
      const inp=document.createElement('input');
      inp.type='number';
      inp.value=f.val;
      inp.oninput=()=>{f.val=inp.value;draw();};
      row.append(inp);
    }else{
      row.append(multi(vr.keys,k=>show(vr,k),f.sel,draw,'Select values…'));
    }
    const b=document.createElement('button');
    b.textContent='Remove';
    b.onclick=()=>{filters.splice(i,1);renderFilters();draw();};
    row.append(b);
    box.append(row);
  });
}

function renderGroupSel(){
  const box=$('gshow');
  box.innerHTML='';
  const gv=$('group').value;
  $('gshowL').hidden=gv==='none';
  if(gv==='none')return;
  const g=V[gv];
  gsel=new Set(g.keys);
  box.append(multi(g.keys,k=>show(g,k),gsel,draw,'None selected','All'));
}

function buildLegend(){
  const box=$('legend');
  box.innerHTML='';
  varOpts().forEach(([n])=>{
    const v=V[n];
    const d=document.createElement('details');
    d.dataset.var=n;
    d.dataset.text=(v.label+' '+n+' '+v.desc).toLowerCase();
    const s=document.createElement('summary');
    s.textContent=v.label;
    const sm=document.createElement('small');
    sm.textContent=n;
    s.append(sm);
    const body=document.createElement('div');
    body.className='desc';
    if(!v.desc)body.textContent='No description in the spreadsheet.';
    else if(v.desc.includes('='))v.desc.split(';').forEach(p=>{
      const x=document.createElement('div');
      x.textContent=p.trim();
      body.append(x);
    });
    else body.textContent=v.desc;
    d.append(s,body);
    box.append(d);
  });
  usedKey='';
}

function markUsed(){
  const used=new Set(filters.map(f=>f.v));
  if($('group').value!=='none')used.add($('group').value);
  const k=[...used].sort().join('|');
  if(k===usedKey)return;
  usedKey=k;
  document.querySelectorAll('#legend details').forEach(d=>{
    const u=used.has(d.dataset.var);
    d.classList.toggle('used',u);
    if(u)d.open=true;
  });
}

function isActive(f){
  return V[f.v].numeric?f.val!==''&&!isNaN(Number(f.val)):f.sel.size>0;
}

function pass(r){
  return filters.every(f=>{
    if(!isActive(f))return true;
    const vr=V[f.v],raw=r[f.v];
    if(vr.numeric){
      if(raw===null||raw==='')return false;
      const x=Number(f.val);
      return f.op==='='?raw===x:f.op==='>'?raw>x:f.op==='>='?raw>=x:f.op==='<'?raw<x:raw<=x;
    }
    return f.sel.has(key(raw))===(f.op==='in');
  });
}

function describe(f){
  const vr=V[f.v];
  if(vr.numeric)return `${vr.label} ${SYM[f.op]} ${f.val}`;
  const ks=vr.keys.filter(k=>f.sel.has(k));
  const t=ks.length>4?ks.length+' selected values':ks.map(k=>show(vr,k)).join(' or ');
  return `${vr.label} ${f.op==='in'?'is':'is not'} ${t}`;
}

const valueLabels={
  id:'valueLabels',
  afterDatasetsDraw(c){
    if(c.config.type==='pie'||c.config.type==='doughnut')return;
    const ctx=c.ctx,ds=c.data.datasets[0],horiz=c.options.indexAxis==='y';
    ctx.save();
    ctx.fillStyle='#1f2328';
    ctx.font='12px system-ui,sans-serif';
    c.getDatasetMeta(0).data.forEach((el,i)=>{
      const v=ds.data[i];
      if(v===null)return;
      if(horiz){ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(fmt(v),el.x+5,el.y);}
      else{ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(fmt(v),el.x,el.y-5);}
    });
    ctx.restore();
  }
};

function draw(){
  if(chart){chart.destroy();chart=null;}
  markUsed();
  const gv=$('group').value,g=gv==='none'?null:V[gv];
  $('gsum').textContent=': '+(g?g.label:'None');
  const mv=$('measure').value,type=$('type').value;
  const [fn,col]=mv.split(':');
  const rec=rows.filter(pass);
  const pie=type==='pie'||type==='doughnut';

  const agg=new Map((g?g.keys:['all']).map(k=>[k,{n:0,s:0,c:0}]));
  rec.forEach(r=>{
    const a=agg.get(g?key(r[g.name]):'all');
    a.n++;
    if(col&&typeof r[col]==='number'){a.s+=r[col];a.c++;}
  });
  let items=[...agg].map(([k,a])=>({k,n:a.n,v:fn==='count'?a.n:fn==='sum'?a.s:(a.c?a.s/a.c:null)}));
  if(g){
    const partial=gsel.size<g.keys.length;
    items=items.filter(i=>gsel.has(i.k)&&(i.n>0||(!pie&&i.k!==''&&(partial||g.keys.length<=15))));
  }else items=items.filter(i=>i.n>0);
  if(pie)items=items.filter(i=>i.v);
  if($('sort').checked)items.sort((a,b)=>(b.v===null?-Infinity:b.v)-(a.v===null?-Infinity:a.v));

  $('chartwrap').hidden=!items.length;
  $('empty').hidden=items.length>0;
  if(!items.length){
    $('empty').textContent=rec.length?'No groups selected.':'No records match these filters.';
    return;
  }

  const mlabel=$('measure').selectedOptions[0].textContent;
  let labels=items.map(i=>g?show(g,i.k):'All matching records');
  const data=items.map(i=>i.v===null?null:Math.round(i.v*10)/10);
  if(pie){
    const total=data.reduce((a,b)=>a+b,0);
    labels=labels.map((l,i)=>`${l}: ${fmt(data[i])} (${Math.round(data[i]/total*100)}%)`);
  }

  const act=filters.filter(isActive);
  const sub=act.length?act.map((f,i)=>(i?'and ':'Where ')+describe(f)):['All records'];
  if(g&&gsel.size<g.keys.length){
    const nm=g.keys.filter(k=>gsel.has(k)).map(k=>show(g,k));
    sub.push(nm.length<=4?'Groups shown: '+nm.join(', '):`Groups shown: ${nm.length} of ${g.keys.length}`);
  }
  sub.push('n = '+items.reduce((a,i)=>a+i.n,0));

  const horiz=type==='hbar';
  const t=horiz?'bar':type;
  const cat=horiz?'y':'x',val=horiz?'x':'y';
  $('chartwrap').style.height=(horiz?Math.max(460,items.length*26+130):460)+'px';

  const scales={};
  if(!pie){
    if(g)scales[cat]={title:{display:true,text:g.label}};
    scales[val]={beginAtZero:true,title:{display:true,text:mlabel},ticks:fn==='count'?{precision:0}:{}};
  }
  chart=new Chart($('chart'),{
    type:t,
    data:{labels,datasets:[{
      label:mlabel,
      data,
      backgroundColor:pie?items.map((_,i)=>PALETTE[i%PALETTE.length]):PALETTE[0],
      borderColor:pie?'#fff':PALETTE[0],
      borderWidth:pie?1:2,
      tension:0,
      pointRadius:4
    }]},
    options:{
      indexAxis:horiz?'y':'x',
      responsive:true,
      maintainAspectRatio:false,
      animation:false,
      layout:{padding:{top:pie?0:22,right:pie?0:36}},
      plugins:{
        legend:{display:pie,position:'right',labels:{font:{size:13}}},
        title:{display:true,text:g?`${mlabel} by ${g.label.toLowerCase()}`:mlabel,font:{size:17}},
        subtitle:{display:true,text:sub,font:{size:12},padding:{bottom:12}},
        tooltip:{enabled:true}
      },
      scales
    },
    plugins:[valueLabels]
  });
}

['measure','type','sort'].forEach(id=>$(id).addEventListener('change',draw));
$('group').addEventListener('change',()=>{renderGroupSel();draw();});
$('add').onclick=()=>{
  filters.push(newFilter(V.Injury_or_Illness_Code?'Injury_or_Illness_Code':varOpts()[0][0]));
  renderFilters();
  draw();
};
$('q').oninput=()=>{
  const q=$('q').value.trim().toLowerCase();
  document.querySelectorAll('#legend details').forEach(d=>{d.hidden=q!==''&&!d.dataset.text.includes(q);});
};
document.addEventListener('click',e=>{
  document.querySelectorAll('details.multi[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});
});

function fail(e){
  $('status').hidden=false;
  $('status').textContent='Could not read the spreadsheet: '+e.message;
}
fetch(DATA_FILE,{cache:'no-cache'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
  .then(b=>{try{init(b);}catch(err){fail(err);}},
    e=>fail(new Error('could not find "'+DATA_FILE+'" next to this page ('+e.message+'). Make sure it is in the same folder as index.html in the repo, the name matches exactly, and the page is served over http(s) (GitHub Pages), not opened as a local file.')));
</script>
</body>
</html>
